settings:
  history-size: 20
  max-target-distance: 20
  messages-prefix: '&8[&6XNBT&8] &r'
  compact-raw-max-keys: 10

help:
  main:
    - '&6XNBT 帮助'
    - ''
    - '&e/xnbt item'
    - '&7格式：/xnbt item'
    - '&7作用：编辑手中物品'
    - ''
    - '&e/xnbt enchant'
    - '&7格式：/xnbt enchant <附魔> <等级>'
    - '&7例子：/xnbt enchant 锋利 100'
    - ''
    - '&e/xnbt attr'
    - '&7格式：/xnbt attr <属性> <数值>'
    - '&7例子：/xnbt attr 最大生命 50'
    - ''
    - '&e/xnbt mob'
    - '&7格式：/xnbt mob <参数>'
    - '&7例子：/xnbt mob maxhealth 1000'
    - ''
    - '&e/xnbt player'
    - '&7格式：/xnbt player <玩家> <参数>'
    - '&7例子：/xnbt player Steve health 100'
    - ''
    - '&e/xnbt item get'
    - '&7格式：/xnbt item get [raw]'
    - '&7例子：/xnbt item get'
    - ''
    - '&e/xnbt help'
    - '&7格式：/xnbt help'
    - '&7作用：查看本帮助'
  enchant:
    - '&6附魔编辑'
    - '&7格式：/xnbt enchant <附魔> <等级>'
    - '&7例子：/xnbt enchant 锋利 100'
  attr:
    - '&6物品属性编辑'
    - '&7格式：/xnbt attr <属性> <数值> [操作] [部位]'
    - '&7例子：/xnbt attr 最大生命 50'
  mob:
    - '&6生物编辑'
    - '&7格式：/xnbt mob <参数>'
    - '&7例子：/xnbt mob maxhealth 1000'
  player:
    - '&6玩家编辑'
    - '&7格式：/xnbt player <玩家> <参数>'
    - '&7例子：/xnbt player Steve health 100'

messages:
  no-permission: '&c你没有使用 XNBT 的权限。'
  player-only: '&c这个命令只能由玩家执行。'
