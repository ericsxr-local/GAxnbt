  invalid-number: '&c数值格式错误：&f%value%'
  invalid-boolean: '&c请输入 true 或 false。'
  invalid-enchant: '&c找不到这个附魔：&f%value%'
  invalid-attribute: '&c找不到这个属性：&f%value%'
  invalid-target: '&c没有找到目标实体，请把准星对准目标，或提供玩家名/UUID。'
  invalid-slot: '&c未知装备部位：&f%value%'
  changed: '&a修改成功。'
